<!-- @dsCard group="Komponenten" viewport="640x470" name="Progress bar" subtitle="Determiniert, indeterminiert, Warnung, Erfolg und Fehler" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:24px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:470px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:12px}
  .grp{margin-bottom:24px;max-width:460px}
  .btn{box-sizing:border-box;height:36px;padding:0 14px;font-family:inherit;font-size:14px;border:1px solid var(--medo-border-strong);border-radius:var(--medo-radius-md);background:var(--medo-surface);color:var(--medo-text);cursor:pointer;margin-top:12px}
  .card{border:1px solid var(--medo-border);border-radius:var(--medo-radius-lg);overflow:hidden;max-width:460px}
  .card .in{padding:14px 16px;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var PB = window.MedoUI.ProgressBar;

  function Demo() {
    var v = React.useState(38);
    var timer = React.useRef(null);
    var run = function () {
      clearInterval(timer.current);
      v[1](0);
      timer.current = setInterval(function () {
        v[1](function (p) {
          if (p >= 100) { clearInterval(timer.current); return 100; }
          return p + 4;
        });
      }, 120);
    };
    React.useEffect(function () { return function () { clearInterval(timer.current); }; }, []);

    return h('div', null,
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Determiniert · Label, Zähler, Prozent'),
        h(PB, {
          label: 'Dateien werden hochgeladen',
          helper: Math.round(v[0] / 100 * 6) + ' von 6 Dateien',
          value: v[0], showValue: true, status: 'normal', size: 'standard'
        }),
        h('button', { className: 'btn', onClick: run }, 'Von 0 laufen lassen')
      ),
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Indeterminiert · unbekannte Dauer'),
        h(PB, { label: 'Register wird abgefragt', ariaLabel: 'Register wird abgefragt' })
      ),
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Abschluss · Erfolg und Fehler'),
        h(PB, { label: 'Import', value: 100, status: 'success', statusText: '312 Einträge übernommen.' }),
        h('div', { style: { height: '18px' } }),
        h(PB, { label: 'Import', value: 64, status: 'error', statusText: 'Abgebrochen bei Zeile 200 — Datei prüfen und erneut starten.' }),
        h('div', { style: { height: '18px' } }),
        h(PB, { label: 'Speicherplatz', value: 91, status: 'warning', statusText: '91 % belegt — alte Nachweise archivieren.' })
      ),
      h('div', null,
        h('div', { className: 'lbl' }, 'Thin · am Kopf einer Karte'),
        h('div', { className: 'card' },
          h(PB, { size: 'thin', value: 72, ariaLabel: 'Profil vollständig zu 72 Prozent' }),
          h('div', { className: 'in' }, 'Profil zu 72 % vollständig'))
      )
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
