<!-- @dsCard group="Komponenten" viewport="700x430" name="Loading" subtitle="Teilring-Spinner inline, Overlay, Vollbild und Skeletons" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:24px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:430px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:12px}
  .grp{margin-bottom:26px}
  .row{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .box{position:relative;border:1px solid var(--medo-border);border-radius:var(--medo-radius-lg);padding:16px;min-height:120px}
  .btn{box-sizing:border-box;height:36px;padding:0 14px;font-family:inherit;font-size:14px;border:1px solid var(--medo-border-strong);border-radius:var(--medo-radius-md);background:var(--medo-surface);color:var(--medo-text);cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var MedoLoading = window.MedoUI.Loading, Sk = window.MedoUI.Skeleton;

  function Demo() {
    var busy = React.useState(true);
    var voll = React.useState(false);
    return h('div', null,
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Spinner · sm / md / lg, mit Text'),
        h('div', { className: 'row' },
          h(MedoLoading, { size: 'sm', variant: 'inline' }),
          h(MedoLoading, { size: 'md', variant: 'inline' }),
          h(MedoLoading, { size: 'lg', variant: 'inline' }),
          h(MedoLoading, { size: 'md', variant: 'inline', label: 'Profile werden geprüft …' }),
          h('button', {
            className: 'btn',
            onClick: function () {
              voll[1](true);
              setTimeout(function () { voll[1](false); }, 1400);
            }
          }, 'Vollbild kurz zeigen'))
      ),
      h('div', { className: 'cols' },
        h('div', null,
          h('div', { className: 'lbl' }, 'Overlay · Inhalt bleibt sichtbar'),
          h('div', { className: 'box' },
            h(Sk, { variant: 'table', rows: 3 }),
            busy[0] ? h(MedoLoading, { variant: 'overlay', size: 'sm' }) : null),
          h('button', {
            className: 'btn', onClick: function () { busy[1](!busy[0]); }
          }, busy[0] ? 'Overlay aus' : 'Overlay an')
        ),
        h('div', null,
          h('div', { className: 'lbl' }, 'Skeleton · Karte und Zeilen'),
          h(Sk, { variant: 'card' }),
          h('div', { style: { height: '16px' } }),
          h(Sk, { variant: 'lines', lines: 3 }),
          h('div', { style: { height: '16px' } }),
          h(Sk, { variant: 'block', height: 56 })
        )
      ),
      voll[0] ? h(MedoLoading, { variant: 'fullpage', label: 'Daten werden geladen …' }) : null
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
