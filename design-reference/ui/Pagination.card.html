<!-- @dsCard group="Komponenten" viewport="740x420" name="Pagination" subtitle="Nummern, volle Tabellenleiste und kompakte Form" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:24px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:420px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:12px}
  .grp{margin-bottom:30px}
  .tbl{border:1px solid var(--medo-border);border-radius:var(--medo-radius-lg);overflow:hidden}
  .tbl .rows{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .tbl .rows span{height:14px;border-radius:5px;background:var(--medo-color-stone-200)}
  .tbl .foot{border-top:1px solid var(--medo-border-subtle);padding:10px 14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var Pag = window.MedoUI.Pagination;

  function Demo() {
    var a = React.useState(4), b = React.useState(2), c = React.useState(3);
    var groesse = React.useState(20);
    return h('div', null,
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Nummern · md, mit erster und letzter Seite'),
        h(Pag, { variant: 'numbers', size: 'md', page: a[0], pageCount: 12, onPageChange: a[1], showFirstLast: true })
      ),
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Volle Leiste · unter einer Tabelle'),
        h('div', { className: 'tbl' },
          h('div', { className: 'rows' }, h('span'), h('span'), h('span'), h('span')),
          h('div', { className: 'foot' },
            h(Pag, {
              variant: 'bar', size: 'sm', page: b[0], pageSize: groesse[0], totalItems: 312,
              onPageChange: b[1], showJump: true,
              onPageSizeChange: function (n) { groesse[1](n); b[1](1); }
            })))
      ),
      h('div', null,
        h('div', { className: 'lbl' }, 'Kompakt · schmale Spalten und Mobil'),
        h(Pag, { variant: 'compact', page: c[0], pageCount: 12, onPageChange: c[1] })
      )
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
