<!-- @dsCard group="Komponenten" viewport="700x760" name="Search" subtitle="Live-Suche mit Vorschlägen, Größen, voller Breite und Werkzeugleiste" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:20px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:760px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:10px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .bar{display:flex;align-items:center;gap:14px;background:var(--medo-surface);border:1px solid var(--medo-border-subtle);border-radius:var(--medo-radius-lg);padding:10px 14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var S = window.MedoUI.Search, MedoIcon = window.MedoUI.Icon;

  function grp(label, kids, cls, extra) {
    var st = { marginBottom: '18px' };
    if (extra) for (var k in extra) st[k] = extra[k];
    return h('div', { style: st }, h('div', { className: 'lbl' }, label), h('div', { className: cls }, kids));
  }

  var vorschlaege = ['Krankenversicherung', 'Krankentagegeld', 'Krankenzusatz'];
  var verlauf = ['Gewerbehaftpflicht', 'Berufsunfähigkeit'];

  var app = h('div', null,
    grp('Mit Vorschlägen · Treffer hervorgehoben', [
      h(S, { key: 1, label: 'Spezialisten suchen', defaultValue: 'kranken',
             suggestions: vorschlaege, defaultOpen: true })
    ], 'cols', { marginBottom: '196px' }),

    grp('Zustände', [
      h(S, { key: 1, label: 'Leer', showPanel: false }),
      h(S, { key: 2, label: 'Ausgefüllt', defaultValue: 'design system', showPanel: false }),
      h(S, { key: 3, label: 'Lädt', defaultValue: 'design system', loading: true, showPanel: false })
    ], 'cols3'),

    grp('Größen · 36 / 40 / 48px und gesperrt', [
      h(S, { key: 1, size: 'sm', label: 'Klein', showPanel: false }),
      h(S, { key: 2, size: 'md', label: 'Mittel', showPanel: false }),
      h(S, { key: 3, size: 'lg', label: 'Groß', showPanel: false }),
      h(S, { key: 4, label: 'Gesperrt', defaultValue: 'nicht aktiv', disabled: true, showPanel: false })
    ], 'cols3'),

    grp('Volle Breite · füllt die Formularspalte', [
      h(S, { key: 1, label: 'Vertrag suchen', fullWidth: true, showPanel: false,
             hint: 'Sucht in Nummer, Kunde und Sparte.' })
    ], ''),

    h('div', null,
      h('div', { className: 'lbl' }, 'Kompakt · in einer Werkzeugleiste'),
      h('div', { className: 'bar' },
        h('span', { style: { fontSize: '16px', fontWeight: 700, flex: 1 } }, 'Mein Netzwerk'),
        h(S, { compact: true, defaultValue: 'medo', showPanel: false, style: { width: '220px' } }),
        h(MedoIcon, { name: 'tune', size: 22, color: 'var(--medo-icon)' })
      )
    )
  );
  ReactDOM.createRoot(document.getElementById('root')).render(app);
</script>
</body>
</html>
