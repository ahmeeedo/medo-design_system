<!-- @dsCard group="Komponenten" viewport="700x360" name="Menu" subtitle="Kontextmenü per Rechtsklick, kippt am Rand nach innen" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:24px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:360px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:560px}
  .tile{border:1px solid var(--medo-border);border-radius:var(--medo-radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:default}
  .tile:hover{background:var(--medo-state-hover)}
  .tn{font-size:14px;font-weight:600}
  .tm{font-family:var(--medo-font-mono);font-size:12px;color:var(--medo-text-muted)}
  .hint{font-size:14px;color:var(--medo-text-muted);margin-top:16px}
  .out{font-family:var(--medo-font-mono);font-size:12px;color:var(--medo-text-muted);margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var Ctx = window.MedoUI.Menu, MedoIcon = window.MedoUI.Icon;

  var DATEIEN = [
    { name: 'Beratungsprotokoll', meta: 'PDF · 240 kB', icon: 'description' },
    { name: 'Gewerbeschein', meta: 'PDF · 1,2 MB', icon: 'description' },
    { name: 'Kundenliste', meta: 'CSV · 18 kB', icon: 'table_view' }
  ];

  function Demo() {
    var last = React.useState('—');
    return h('div', null,
      h('div', { className: 'lbl' }, 'Rechtsklick auf eine Kachel'),
      h('div', { className: 'grid' },
        DATEIEN.map(function (d, i) {
          return h(Ctx, {
            key: i, ariaLabel: 'Aktionen zu ' + d.name,
            onSelect: function (v) { last[1](v + ' · ' + d.name); },
            items: [
              { value: 'oeffnen', icon: 'open_in_new', label: 'Öffnen', shortcut: 'Enter' },
              { value: 'umbenennen', icon: 'edit', label: 'Umbenennen', shortcut: 'F2' },
              { value: 'teilen', icon: 'share', label: 'Im Netzwerk teilen' },
              { value: 'signieren', icon: 'draw', label: 'Digital signieren', disabled: true },
              { type: 'divider' },
              { value: 'herunterladen', icon: 'download', label: 'Herunterladen' },
              { value: 'loeschen', icon: 'delete', label: 'Löschen', danger: true }
            ]
          }, h('div', { className: 'tile' },
               h(MedoIcon, { name: d.icon, size: 22, color: 'var(--medo-icon-muted)' }),
               h('div', { className: 'tn' }, d.name),
               h('div', { className: 'tm' }, d.meta)));
        })),
      h('div', { className: 'hint' }, 'Jede Aktion ist zusätzlich über das Kebab-Menü der Detailseite erreichbar.'),
      h('div', { className: 'out' }, 'Zuletzt gewählt: ' + last[0])
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
