<!-- @dsCard group="Komponenten" viewport="700x380" name="Checkbox" subtitle="Mehrfachauswahl mit Zwischenzustand, Gruppe senkrecht und waagerecht" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:20px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:380px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:10px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .row{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
  .grp{margin-bottom:18px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var CB = window.MedoUI.Checkbox, CBG = window.MedoUI.CheckboxGroup;

  var app = h('div', null,
    h('div', { className: 'cols' },
      h('div', null,
        h('div', { className: 'lbl' }, 'Gruppe'),
        h(CBG, { legend: 'Benachrichtigungen', direction: 'vertical' },
          h(CB, { key: 1, label: 'Neue Einladungen', defaultChecked: true }),
          h(CB, { key: 2, label: 'Alle Kategorien', hint: 'Einige ausgewählt', indeterminate: true }),
          h(CB, { key: 3, label: 'Produktneuheiten' })
        )
      ),
      h('div', null,
        h('div', { className: 'lbl' }, 'Zustände'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
          h(CB, { key: 1, label: 'Aus' }),
          h(CB, { key: 2, label: 'An', defaultChecked: true }),
          h(CB, { key: 3, label: 'Fehler', error: true, hint: 'Zustimmung erforderlich' }),
          h(CB, { key: 4, label: 'Gesperrt, aus', disabled: true }),
          h(CB, { key: 5, label: 'Gesperrt, an', disabled: true, defaultChecked: true })
        )
      )
    ),
    h('div', { className: 'grp', style: { marginTop: '18px' } },
      h('div', { className: 'lbl' }, 'Größen · 18 / 20px'),
      h('div', { className: 'row' },
        h(CB, { key: 1, size: 'sm', label: 'Klein', defaultChecked: true }),
        h(CB, { key: 2, size: 'md', label: 'Mittel', defaultChecked: true }),
        h(CB, { key: 3, label: 'Einzeln: Ich habe die Bedingungen gelesen' })
      )
    ),
    h('div', null,
      h('div', { className: 'lbl' }, 'Gruppe waagerecht · kurze Labels'),
      h(CBG, { legend: 'Sparten', direction: 'horizontal' },
        h(CB, { key: 1, label: 'Gewerbe', defaultChecked: true }),
        h(CB, { key: 2, label: 'Vorsorge' }),
        h(CB, { key: 3, label: 'Cyber', defaultChecked: true })
      )
    )
  );
  ReactDOM.createRoot(document.getElementById('root')).render(app);
</script>
</body>
</html>
