<!-- @dsCard group="Komponenten" viewport="700x640" name="Slider" subtitle="Stufenlos, diskret mit Ticks, sm, vertikal und gekoppeltes Feld" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:24px 22px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);min-height:640px;box-sizing:border-box}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500);margin-bottom:14px}
  .grp{margin-bottom:26px;max-width:520px}
  .row{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap}
  .num{box-sizing:border-box;width:84px;height:40px;padding:0 12px;border:1px solid var(--medo-input-border);border-radius:var(--medo-radius-md);font-family:var(--medo-font-mono);font-size:14px;color:var(--medo-input-text);text-align:right}
  .num:focus-visible{outline:none;border-color:var(--medo-action);box-shadow:0 0 0 3px var(--medo-focus-ring)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../_ds_bundle.js"></script>
<script>
  var h = React.createElement;
  var SL = window.MedoUI.Slider;

  function Demo() {
    var laut = React.useState(64);
    var qual = React.useState(2);
    var klein = React.useState(30);
    var hell = React.useState(70);
    var umkreis = React.useState(25);

    return h('div', null,
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Stufenlos · md · mit End-Icons'),
        h(SL, {
          ariaLabel: 'Lautstärke', label: 'Lautstärke', startIcon: 'volume_down', endIcon: 'volume_up',
          size: 'md', orientation: 'horizontal', showValue: true,
          showMinMax: true, value: laut[0], onChange: laut[1]
        })
      ),
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Diskret · sichtbare Ticks + Stufen-Labels'),
        h(SL, {
          ariaLabel: 'Qualität', min: 0, max: 3, step: 1, showTicks: true,
          stepLabels: ['Niedrig', 'Mittel', 'Hoch', 'Maximal'],
          value: qual[0], onChange: qual[1]
        })
      ),
      h('div', { className: 'grp' },
        h('div', { className: 'lbl' }, 'Stufenlos · sm'),
        h(SL, { size: 'sm', ariaLabel: 'Wert klein', value: klein[0], onChange: klein[1] })
      ),
      h('div', { className: 'row' },
        h('div', null,
          h('div', { className: 'lbl' }, 'Vertikal'),
          h(SL, {
            orientation: 'vertical', ariaLabel: 'Helligkeit',
            startIcon: 'wb_sunny', endIcon: 'bedtime',
            value: hell[0], onChange: hell[1]
          })),
        h('div', { style: { flex: 1, minWidth: '260px' } },
          h('div', { className: 'lbl' }, 'Gekoppeltes Zahlenfeld'),
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '16px' } },
            h('div', { style: { flex: 1 } },
              h(SL, {
                ariaLabel: 'Umkreis', min: 5, max: 100, step: 5,
                formatValue: function (v) { return v + ' km'; },
                value: umkreis[0], onChange: umkreis[1]
              })),
            h('input', {
              className: 'num', type: 'text', inputMode: 'numeric',
              'aria-label': 'Umkreis in Kilometern', value: umkreis[0],
              onChange: function (e) {
                var n = parseInt(e.target.value.replace(/[^0-9]/g, ''), 10);
                if (!isNaN(n)) umkreis[1](Math.min(100, Math.max(5, n)));
              }
            })),
          h('div', { className: 'lbl', style: { marginTop: '12px', marginBottom: 0 } }, 'Deaktiviert'),
          h(SL, { ariaLabel: 'Deaktiviert', value: 40, disabled: true }))
      )
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
