<!-- @dsCard group="Typografie" viewport="700x110" name="Schnitte" subtitle="Vier Gewichte, 600 für Überschriften in UI" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:110px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:22px;align-items:baseline"><div><div style="font-size:23px;font-weight:400">Aa</div><div class="n" style="margin-top:4px">regular 400</div></div><div><div style="font-size:23px;font-weight:500">Aa</div><div class="n" style="margin-top:4px">medium 500</div></div><div><div style="font-size:23px;font-weight:600">Aa</div><div class="n" style="margin-top:4px">semibold 600</div></div><div><div style="font-size:23px;font-weight:700">Aa</div><div class="n" style="margin-top:4px">bold 700</div></div></div>
</body>
</html>
