<!-- @dsCard group="Grundlagen" viewport="700x130" name="Radien" subtitle="Chips und Tags immer full" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:130px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:11px;align-items:flex-end"><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-none)"></div><div class="n" style="margin-top:6px">none</div><div class="hex">0</div></div><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-sm)"></div><div class="n" style="margin-top:6px">sm</div><div class="hex">4</div></div><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-md)"></div><div class="n" style="margin-top:6px">md</div><div class="hex">8</div></div><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-lg)"></div><div class="n" style="margin-top:6px">lg</div><div class="hex">12</div></div><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-xl)"></div><div class="n" style="margin-top:6px">xl</div><div class="hex">18</div></div><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-2xl)"></div><div class="n" style="margin-top:6px">2xl</div><div class="hex">24</div></div><div style="text-align:center"><div style="width:62px;height:56px;background:var(--medo-primary-100);border:1px solid var(--medo-primary-300);border-radius:var(--medo-radius-full)"></div><div class="n" style="margin-top:6px">full</div><div class="hex">9999</div></div></div>
</body>
</html>
