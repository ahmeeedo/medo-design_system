<!-- @dsCard group="Grundlagen" viewport="700x170" name="Abstände in Anwendung" subtitle="Karte: Padding lg, Gap sm, Radius lg" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:170px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="background:var(--medo-surface);border:1px solid var(--medo-border-subtle);border-radius:var(--medo-radius-lg);box-shadow:var(--medo-shadow-sm);padding:var(--medo-space-lg);display:flex;flex-direction:column;gap:var(--medo-space-sm)"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:var(--medo-text-base);font-weight:600">Terminübersicht</div><div style="background:var(--medo-primary-100);color:var(--medo-primary-800);border-radius:var(--medo-radius-full);padding:3px 10px;font-size:11.5px;font-weight:500">aktiv</div></div><div style="font-size:var(--medo-text-sm);line-height:var(--medo-text-sm-line);color:var(--medo-text-muted)">Alle Standorte greifen auf denselben Datenstand zu.</div><div style="display:flex;gap:var(--medo-space-xs);margin-top:var(--medo-space-2xs)"><div style="background:var(--medo-action);color:var(--medo-action-text);border-radius:var(--medo-radius-md);padding:8px 14px;font-size:13px;font-weight:500">Öffnen</div><div style="background:var(--medo-action-neutral);color:var(--medo-action-neutral-text);border-radius:var(--medo-radius-md);padding:8px 14px;font-size:13px;font-weight:500">Später</div></div></div>
</body>
</html>
