<!-- @dsCard group="Farben · Ebene 3 · Semantic" viewport="700x180" name="Text" subtitle="Sechs Textrollen; muted ist transparent, nicht gemischt" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:180px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .tok{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em;margin-top:6px;line-height:1.35}
  .tile{flex:1;height:52px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px"><div><div style="font-size:16px;color:var(--medo-text)">Termin anlegen</div><div class="tok" style="margin-top:2px">text · stone-1000</div></div><div><div style="font-size:16px;color:var(--medo-text-subtle)">Termin anlegen</div><div class="tok" style="margin-top:2px">text-subtle · stone-800</div></div><div><div style="font-size:16px;color:var(--medo-text-muted)">Termin anlegen</div><div class="tok" style="margin-top:2px">text-muted · stone-1000 @68 %</div></div><div><div style="font-size:16px;color:var(--medo-text-disabled)">Termin anlegen</div><div class="tok" style="margin-top:2px">text-disabled · stone-500</div></div><div><div style="font-size:16px;color:var(--medo-text-link)">Termin anlegen</div><div class="tok" style="margin-top:2px">text-link · teal-600</div></div><div><div style="font-size:16px;color:var(--medo-text-link-hover)">Termin anlegen</div><div class="tok" style="margin-top:2px">text-link-hover · teal-800</div></div></div><div style="margin-top:12px;background:var(--medo-action);border-radius:var(--medo-radius-md);padding:10px 14px;display:inline-block"><span style="font-size:16px;color:var(--medo-text-on-primary)">Auf Primärfläche</span><div class="tok" style="color:#ffffffb8;margin-top:2px">text-on-primary · white</div></div>
</body>
</html>
