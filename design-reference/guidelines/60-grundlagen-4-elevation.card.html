<!-- @dsCard group="Grundlagen" viewport="700x150" name="Schatten" subtitle="Warme Basis rgba(31,29,26) — nie neutralgrau" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:150px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:18px;padding:6px 2px"><div style="flex:1"><div style="height:66px;background:var(--medo-surface);border-radius:var(--medo-radius-lg);box-shadow:var(--medo-shadow-sm)"></div><div class="n" style="margin-top:10px;text-align:center">shadow-sm</div></div><div style="flex:1"><div style="height:66px;background:var(--medo-surface);border-radius:var(--medo-radius-lg);box-shadow:var(--medo-shadow-md)"></div><div class="n" style="margin-top:10px;text-align:center">shadow-md</div></div><div style="flex:1"><div style="height:66px;background:var(--medo-surface);border-radius:var(--medo-radius-lg);box-shadow:var(--medo-shadow-lg)"></div><div class="n" style="margin-top:10px;text-align:center">shadow-lg</div></div><div style="flex:1"><div style="height:66px;background:var(--medo-surface);border-radius:var(--medo-radius-lg);box-shadow:var(--medo-shadow-xl)"></div><div class="n" style="margin-top:10px;text-align:center">shadow-xl</div></div></div>
</body>
</html>
