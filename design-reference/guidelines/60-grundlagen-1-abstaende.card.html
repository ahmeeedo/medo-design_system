<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:140px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:8px;align-items:flex-end"><div style="text-align:center"><div style="width:var(--medo-space-3xs);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">3xs</div><div class="hex">2</div></div><div style="text-align:center"><div style="width:var(--medo-space-2xs);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">2xs</div><div class="hex">4</div></div><div style="text-align:center"><div style="width:var(--medo-space-xs);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">xs</div><div class="hex">8</div></div><div style="text-align:center"><div style="width:var(--medo-space-sm);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">sm</div><div class="hex">12</div></div><div style="text-align:center"><div style="width:var(--medo-space-md);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">md</div><div class="hex">16</div></div><div style="text-align:center"><div style="width:var(--medo-space-lg);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">lg</div><div class="hex">24</div></div><div style="text-align:center"><div style="width:var(--medo-space-xl);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">xl</div><div class="hex">32</div></div><div style="text-align:center"><div style="width:var(--medo-space-2xl);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">2xl</div><div class="hex">48</div></div><div style="text-align:center"><div style="width:var(--medo-space-3xl);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">3xl</div><div class="hex">64</div></div><div style="text-align:center"><div style="width:var(--medo-space-4xl);height:56px;background:var(--medo-primary-600);border-radius:2px;margin:0 auto"></div><div class="n" style="margin-top:6px">4xl</div><div class="hex">96</div></div></div>
</body>
</html>
