<!-- @dsCard group="Farben · Ebene 3 · Semantic" viewport="700x150" name="Flächen in Anwendung" subtitle="Semantische Rollen für Hintergrund und Schrift" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:150px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:10px;height:100%"><div style="flex:1;background:var(--medo-surface);border:1px solid var(--medo-border);border-radius:var(--medo-radius-lg);padding:12px"><div style="font-size:13px;font-weight:600">Text</div><div style="font-size:12px;color:var(--medo-text-muted);margin-top:3px">Text muted</div><div style="font-size:12px;color:var(--medo-text-subtle);margin-top:2px">Text subtle</div><div style="font-size:12px;color:var(--medo-text-disabled);margin-top:2px">Text disabled</div><div class="lbl" style="margin-top:9px">surface</div></div><div style="flex:1;background:var(--medo-surface-container);border:1px solid var(--medo-border-subtle);border-radius:var(--medo-radius-lg);padding:12px"><div style="font-size:13px;font-weight:600">Container</div><div style="font-size:12px;color:var(--medo-text-muted);margin-top:3px">stone-50</div><div class="lbl" style="margin-top:9px">surface-container</div></div><div style="flex:1;background:var(--medo-surface-selected);border:1px solid var(--medo-primary-200);border-radius:var(--medo-radius-lg);padding:12px"><div style="font-size:13px;font-weight:600">Ausgewählt</div><div style="font-size:12px;color:var(--medo-text-muted);margin-top:3px">teal-100</div><div class="lbl" style="margin-top:9px">surface-selected</div></div><div style="flex:1;background:var(--medo-color-stone-1000);border-radius:var(--medo-radius-lg);padding:12px"><div style="font-size:13px;font-weight:600;color:var(--medo-color-white)">Invers</div><div style="font-size:12px;color:#ffffffb0;margin-top:3px">stone-1000</div><div class="lbl" style="margin-top:9px;color:#ffffff80">scrim / invers</div></div></div>
</body>
</html>
