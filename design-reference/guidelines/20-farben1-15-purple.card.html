<!-- @dsCard group="Farben · Ebene 1 · Brand" viewport="700x120" name="Purple" subtitle="12 Stufen, keine Rolle belegt" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:120px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--medo-color-purple-50);border-color:var(--medo-border)"></div><div class="n">50</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-100);border-color:var(--medo-border)"></div><div class="n">100</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-200)"></div><div class="n">200</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-300)"></div><div class="n">300</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-400)"></div><div class="n">400</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-500)"></div><div class="n">500</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-600)"></div><div class="n">600</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-700)"></div><div class="n">700</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-800)"></div><div class="n">800</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-900)"></div><div class="n">900</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-1000)"></div><div class="n">1000</div></div><div class="sw"><div class="chip" style="background:var(--medo-color-purple-1100)"></div><div class="n">1100</div></div></div>
</body>
</html>
