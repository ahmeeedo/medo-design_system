<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:140px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
  .ms{font-family:"Material Symbols Rounded";font-weight:300;font-variation-settings:"FILL" 0;font-size:26px;line-height:1;color:var(--medo-icon)}
</style>
</head>
<body>
<div style="display:flex;gap:26px;align-items:flex-start"><div style="text-align:center"><span class="ms">search</span></div><div style="text-align:center"><span class="ms">check_circle</span></div><div style="text-align:center"><span class="ms">info</span></div><div style="text-align:center"><span class="ms">warning</span></div><div style="text-align:center"><span class="ms">delete</span></div><div style="text-align:center"><span class="ms">settings</span></div><div style="text-align:center"><span class="ms">calendar_month</span></div><div style="text-align:center"><span class="ms">person</span></div><div style="text-align:center"><span class="ms">arrow_forward</span></div><div style="text-align:center"><span class="ms">close</span></div></div><div class="hex" style="margin-top:16px">Größen 18 / 20 / 24 px · Farbe erbt von der Textfarbe · niemals eigene SVG-Icons</div><div style="display:flex;gap:18px;margin-top:12px;align-items:flex-end"><div style="text-align:center"><span class="ms" style="font-size:18px">favorite</span><div class="hex" style="margin-top:4px">18</div></div><div style="text-align:center"><span class="ms" style="font-size:20px">favorite</span><div class="hex" style="margin-top:4px">20</div></div><div style="text-align:center"><span class="ms" style="font-size:24px">favorite</span><div class="hex" style="margin-top:4px">24</div></div></div>
</body>
</html>
