<!-- @dsCard group="Marke" viewport="700x140" name="Wortmarke" subtitle="Punkt immer in primary-600" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:140px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:30px;align-items:center;height:100%"><img src="../logo-medo.svg" alt="medo" style="height:46px"><div style="background:var(--medo-color-stone-1000);border-radius:var(--medo-radius-lg);padding:14px 22px"><img src="../logo-medo.svg" alt="medo" style="height:34px;filter:invert(1) brightness(1.6)"></div><div class="hex" style="max-width:190px;line-height:1.6">Mindesthöhe 24px. Auf dunklem Grund invertiert, der Punkt darf mitlaufen.</div></div>
</body>
</html>
