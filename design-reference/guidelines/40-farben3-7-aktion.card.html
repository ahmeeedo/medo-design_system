<!-- @dsCard group="Farben · Ebene 3 · Semantic" viewport="700x130" name="Aktion" subtitle="Ruhezustand, Hover, Aktiv, Deaktiviert" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:130px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;gap:26px;align-items:flex-start"><div><div class="lbl">action</div><div style="display:flex;gap:7px;margin-top:8px"><div style="background:var(--medo-action);color:var(--medo-action-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">default</div><div style="background:var(--medo-action-hover);color:var(--medo-action-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">hover</div><div style="background:var(--medo-action-active);color:var(--medo-action-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">active</div><div style="background:var(--medo-action-disabled);color:var(--medo-action-text-disabled);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">disabled</div></div></div><div><div class="lbl">action-neutral</div><div style="display:flex;gap:7px;margin-top:8px"><div style="background:var(--medo-action-neutral);color:var(--medo-action-neutral-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">default</div><div style="background:var(--medo-action-neutral-hover);color:var(--medo-action-neutral-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">hover</div><div style="background:var(--medo-action-neutral-active);color:var(--medo-action-neutral-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500">active</div></div></div></div><div style="margin-top:14px;display:flex;gap:10px;align-items:center"><div style="background:var(--medo-action);color:var(--medo-action-text);border-radius:var(--medo-radius-md);padding:9px 15px;font-size:12.5px;font-weight:500;box-shadow:0 0 0 3px var(--medo-focus-ring)">Fokus-Ring</div><div class="hex">focus-ring · 3px, primary-600 @ 35%</div></div>
</body>
</html>
