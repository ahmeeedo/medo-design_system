<!-- @dsCard group="Farben · Ebene 3 · Semantic" viewport="700x120" name="Icon" subtitle="Vier Icon-Rollen, Material Symbols Rounded 300" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:120px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .tok{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em;margin-top:6px;line-height:1.35}
  .tile{flex:none;height:52px;width:100%;box-sizing:border-box;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div class="row" style="gap:10px"><div class="sw" style="gap:0"><div class="tile" style="height:52px;display:flex;align-items:center;justify-content:center;background:var(--medo-surface);border-color:var(--medo-border)"><span style="font-family:'Material Symbols Rounded';font-weight:300;font-size:24px;line-height:1;color:var(--medo-icon)">search</span></div><div class="tok">icon<br>stone-900</div></div><div class="sw" style="gap:0"><div class="tile" style="height:52px;display:flex;align-items:center;justify-content:center;background:var(--medo-surface);border-color:var(--medo-border)"><span style="font-family:'Material Symbols Rounded';font-weight:300;font-size:24px;line-height:1;color:var(--medo-icon-muted)">info</span></div><div class="tok">icon-muted<br>stone-1000 @55 %</div></div><div class="sw" style="gap:0"><div class="tile" style="height:52px;display:flex;align-items:center;justify-content:center;background:var(--medo-surface);border-color:var(--medo-border)"><span style="font-family:'Material Symbols Rounded';font-weight:300;font-size:24px;line-height:1;color:var(--medo-icon-disabled)">lock</span></div><div class="tok">icon-disabled<br>stone-500</div></div><div class="sw" style="gap:0"><div class="tile" style="height:52px;display:flex;align-items:center;justify-content:center;background:var(--medo-action);border-color:var(--medo-border)"><span style="font-family:'Material Symbols Rounded';font-weight:300;font-size:24px;line-height:1;color:var(--medo-icon-on-primary)">check</span></div><div class="tok">icon-on-primary<br>white</div></div></div>
</body>
</html>
