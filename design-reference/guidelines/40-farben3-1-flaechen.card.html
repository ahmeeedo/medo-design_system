<!-- @dsCard group="Farben · Ebene 3 · Semantic" viewport="700x120" name="Flächen" subtitle="Basis ist Weiß, Abstufung nach unten in Stone" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:120px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .tok{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em;margin-top:6px;line-height:1.35}
  .tile{flex:none;height:52px;width:100%;box-sizing:border-box;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div class="row" style="gap:8px"><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-surface);border-color:var(--medo-border)"></div><div class="tok">surface<br>white</div></div><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-surface-container);border-color:var(--medo-border)"></div><div class="tok">surface-container<br>stone-50</div></div><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-surface-container-high);border-color:var(--medo-border)"></div><div class="tok">surface-container-high<br>stone-100</div></div><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-surface-sunken);border-color:var(--medo-border)"></div><div class="tok">surface-sunken<br>stone-100</div></div><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-surface-hover);border-color:var(--medo-border)"></div><div class="tok">surface-hover<br>stone-100</div></div><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-surface-selected);border-color:var(--medo-border)"></div><div class="tok">surface-selected<br>teal-100</div></div><div class="sw" style="gap:0"><div class="tile" style="background:var(--medo-overlay);border-color:var(--medo-border)"></div><div class="tok">overlay<br>white</div></div></div>
</body>
</html>
