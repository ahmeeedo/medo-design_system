<!-- @dsCard group="Typografie" viewport="700x160" name="Skala · Text" subtitle="16px Basis, xs nur für Metadaten" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:160px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em;white-space:nowrap}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:7px"><div class="n" style="width:94px;flex:none">text-lg · 20</div><div style="font-size:var(--medo-text-lg);line-height:var(--medo-text-lg-line)">Der Inhalt führt.</div></div><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:7px"><div class="n" style="width:94px;flex:none">text-base · 16</div><div style="font-size:var(--medo-text-base);line-height:var(--medo-text-base-line)">Der Inhalt führt.</div></div><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:7px"><div class="n" style="width:94px;flex:none">text-sm · 14</div><div style="font-size:var(--medo-text-sm);line-height:var(--medo-text-sm-line)">Der Inhalt führt.</div></div><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:7px"><div class="n" style="width:94px;flex:none">text-xs · 12</div><div style="font-size:var(--medo-text-xs);line-height:var(--medo-text-xs-line)">Der Inhalt führt.</div></div>
</body>
</html>
