<!-- @dsCard group="Farben · Ebene 3 · Semantic" viewport="700x150" name="Status" subtitle="Surface, Border, Solid und Textfarbe je Status" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 20px;font-family:var(--medo-font-sans);background:var(--medo-surface);color:var(--medo-text);height:150px;box-sizing:border-box;overflow:hidden}
  .row{display:flex;gap:6px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:44px;border-radius:var(--medo-radius-md);border:1px solid var(--medo-border-subtle)}
  .n{font-family:var(--medo-font-mono);font-size:10px;color:var(--medo-text-muted);letter-spacing:0.02em}
  .hex{font-family:var(--medo-font-mono);font-size:9.5px;color:var(--medo-text-muted)}
  .lbl{font-family:var(--medo-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--medo-color-stone-500)}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div><div style="background:var(--medo-success-surface);border:1px solid var(--medo-success-border);border-radius:var(--medo-radius-md);padding:9px 11px"><div style="font-size:12px;font-weight:600;color:var(--medo-success-text)">Success</div><div class="hex" style="margin-top:2px">surface + border</div></div><div style="margin-top:7px;background:var(--medo-success-solid);color:var(--medo-success-on-solid);border-radius:var(--medo-radius-md);padding:7px 11px;font-size:11.5px;font-weight:500">solid</div></div><div><div style="background:var(--medo-warning-surface);border:1px solid var(--medo-warning-border);border-radius:var(--medo-radius-md);padding:9px 11px"><div style="font-size:12px;font-weight:600;color:var(--medo-warning-text)">Warning</div><div class="hex" style="margin-top:2px">surface + border</div></div><div style="margin-top:7px;background:var(--medo-warning-solid);color:var(--medo-warning-on-solid);border-radius:var(--medo-radius-md);padding:7px 11px;font-size:11.5px;font-weight:500">solid</div></div><div><div style="background:var(--medo-error-surface);border:1px solid var(--medo-error-border);border-radius:var(--medo-radius-md);padding:9px 11px"><div style="font-size:12px;font-weight:600;color:var(--medo-error-text)">Error</div><div class="hex" style="margin-top:2px">surface + border</div></div><div style="margin-top:7px;background:var(--medo-error-solid);color:var(--medo-error-on-solid);border-radius:var(--medo-radius-md);padding:7px 11px;font-size:11.5px;font-weight:500">solid</div></div><div><div style="background:var(--medo-info-surface);border:1px solid var(--medo-info-border);border-radius:var(--medo-radius-md);padding:9px 11px"><div style="font-size:12px;font-weight:600;color:var(--medo-info-text)">Info</div><div class="hex" style="margin-top:2px">surface + border</div></div><div style="margin-top:7px;background:var(--medo-info-solid);color:var(--medo-info-on-solid);border-radius:var(--medo-radius-md);padding:7px 11px;font-size:11.5px;font-weight:500">solid</div></div></div>
</body>
</html>
