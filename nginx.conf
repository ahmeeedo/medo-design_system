# Cache rules by path. Only server-level add_header is used: a location with its own add_header would drop
# all headers of the server block (nginx does not merge them).
map $uri $medo_cache_control {
    # Content-hashed Storybook assets: a new deploy has new file names.
    ~^/assets/                   "public, max-age=31536000, immutable";
    # Fonts keep their names across versions: cache them, but not forever.
    ~^/fonts/                    "public, max-age=2592000";
    # Entry points and the unhashed Storybook UI files: always revalidate, otherwise a deploy stays invisible.
    ~\.(html|json)$              "no-cache";
    ~^/sb-(manager|addons|common-assets)/ "no-cache";
    default                      "public, max-age=3600";
}

# storybook.med-o.de is an alias: send visitors to the main address (permanent redirect).
server {
    listen 80;
    server_name storybook.med-o.de;
    return 301 https://design.med-o.de$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $medo_cache_control always;
    # HTTPS only (TLS ends at the proxy in front). No includeSubDomains: other subdomains are not ours to decide.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Storybook embeds its own preview iframe; nobody else may frame the site.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
