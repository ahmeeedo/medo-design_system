server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Build output is content-hashed, so a name never gets new content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes have no file on disk; the router resolves them
    # after index.html has loaded. Without this every reload or shared
    # link on /button, /brand and so on ends in a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry point must never be cached, or a deploy stays invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
