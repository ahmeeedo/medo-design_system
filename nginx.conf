# storybook.med-o.de is an alias: send visitors to the main address (permanent redirect).
server {
    listen 80;
    server_name storybook.med-o.de;
    return 301 https://design.med-o.de$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Storybook assets are content-hashed: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Entry points must never be cached, otherwise a deploy stays invisible.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
