# Update screenshots: creates the reference screenshots of the visual regression check and commits them.
# Run it from the Actions tab (“Run workflow”) on the branch of the pull request whose look is correct – after an
# intended visual change (the job “visual” is red). Not on main: main only changes through pull requests. References are only made here: fonts render slightly
# differently on every OS, so screenshots from a laptop would never match CI.
#
# With the secret RELEASE_TOKEN (see release.yml) the commit starts “Storybook tests” right away. With the
# built-in token GitHub starts no workflow for it, and the tests run again with the next push.
name: Update screenshots

on:
  workflow_dispatch:

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # commit the references to the branch

jobs:
  update:
    # main is protected (pull requests only): run it on the branch of the pull request.
    if: github.ref != 'refs/heads/main'
    # Same OS and browser as “Storybook tests”, or the references would not match there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The references are pushed with these credentials.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Start from an empty folder, so references of removed stories go away. PNG output is deterministic:
      # unchanged stories produce identical files, and the commit shows only real changes.
      - name: Create references
        run: |
          rm -rf apps/storybook/__screenshots__
          npm run build:tokens
          cd apps/storybook && npx vitest --run --update --project visual --project visual-dark

      - name: Commit references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/__screenshots__
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "test: update reference screenshots"
            git push
          fi
