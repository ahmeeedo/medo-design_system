# Release: Changesets opens a "Version Packages" pull request when changesets are on main.
# Merging that pull request publishes the new versions of @med-o/design-tokens and @med-o/ui to npm.
# Authentication: npm trusted publishing (OIDC) – no npm token stored in GitHub. Provenance is added automatically.
#
# Optional secret RELEASE_TOKEN (fine-grained token: this repository, Contents + Pull requests read/write):
# GitHub does not start workflows for pull requests opened with its built-in token, so the checks of the
# “Version Packages” pull request wait for an approval. Opened with RELEASE_TOKEN, they run on their own.
#
# Starts only after “Storybook tests” passed for the same commit on main – nothing is published from a red build.
# Then the docs (design.med-o.de) are deployed – after a release, so they show what is on npm, or after a push without
# pending changesets (docs and CI changes). While changesets wait in the “Version Packages” pull request, the docs stay
# on the released version.
#
# After a release, the job notify-docs tells the docs site repository (ahmeeedo/design.med-o.de) which versions are on
# npm, so it can open a pull request that updates @med-o/ui and @med-o/design-tokens there. It sends a
# repository_dispatch event “med-o-release” whose client_payload lists the published packages as Changesets reports
# them (any order): {"packages": [{"name": "@med-o/design-tokens", "version": "0.10.1"}, {"name": "@med-o/ui", …}]}
# Secret DOCS_DISPATCH_TOKEN (fine-grained token: only the repository ahmeeedo/design.med-o.de, Contents read and
# write, 1 year expiry). Without it the job prints a notice and succeeds; the release itself is not affected.
name: Release

on:
  workflow_run:
    workflows: [Storybook tests]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only a push to main whose tests are all green (pull requests run the same workflow and are skipped here).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # version commit and tags
      pull-requests: write # "Version Packages" pull request
      id-token: write # npm trusted publishing
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      # changesets/action v2 names its outputs in kebab case.
      pending: ${{ steps.changesets.outputs['has-changesets'] }}
      # JSON array of {name, version}, only set after a publish.
      packages: ${{ steps.changesets.outputs['published-packages'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Exactly the commit that was tested – not a newer one that landed in the meantime.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The action pushes through the GitHub API with its own github-token; git needs no stored credentials.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # No registry-url: it writes an .npmrc with a placeholder token, and npm would send that token
          # instead of using trusted publishing (the publish then fails with E404).

      - run: npm ci

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node may be older.
      - run: npm install -g npm@latest && npm --version

      # v2 needs @changesets/cli 3. Version commit and tags are pushed through the GitHub API (signed, attributed to
      # the owner of the token). The token must be passed as github-token – the GITHUB_TOKEN variable is ignored.
      - uses: changesets/action@v2
        id: changesets
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          # changeset version plus the release date under each new version in the changelogs.
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Version Packages
          commit-message: 'chore: version packages'

  docs:
    needs: release
    if: needs.release.outputs.published == 'true' || needs.release.outputs.pending == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  notify-docs:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {} # the call uses DOCS_DISPATCH_TOKEN, not the built-in token
    steps:
      - name: Send the release to the docs site
        env:
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          PACKAGES: ${{ needs.release.outputs.packages }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Docs site not notified::Add the secret DOCS_DISPATCH_TOKEN to send each release to ahmeeedo/design.med-o.de."
            exit 0
          fi
          # jq builds the body, so the package list is passed on as JSON and never pasted into the script.
          body=$(jq --compact-output --null-input --argjson packages "$PACKAGES" \
            '{event_type: "med-o-release", client_payload: {packages: $packages}}')
          status=$(curl --silent --show-error --max-time 30 --request POST --output response.txt --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$body" \
            https://api.github.com/repos/ahmeeedo/design.med-o.de/dispatches)
          # GitHub answers 204 without a body; anything else says why (token expired, wrong repository, no access).
          if [ "$status" != "204" ]; then
            echo "::error title=Docs site not notified::HTTP $status – $(cat response.txt)"
            exit 1
          fi
          echo "Sent med-o-release to ahmeeedo/design.med-o.de: $body" >> "$GITHUB_STEP_SUMMARY"
