# Deploy docs: builds the Storybook into a Docker image, pushes it to the GitHub Container Registry and tells Coolify to
# run it. The server only pulls the finished image – it never builds.
#
# Started by “Release” (after a release, or after a push without pending changesets – docs and CI changes), or by hand
# (Actions → Deploy docs → Run workflow) to deploy main again.
# Image: ghcr.io/ahmeeedo/medo-design-system-docs with the tags <version of @med-o/ui>, sha-<commit> and latest.
# Rollback: in Coolify, set the image tag to an earlier version and redeploy.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   COOLIFY_WEBHOOK  Coolify → the docs resource → Webhooks → Deploy webhook (URL)
#   COOLIFY_TOKEN    Coolify → Keys & Tokens → API tokens (permission “deploy”)
# Without them the image is still pushed; only the deploy step is skipped.
name: Deploy docs

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to ghcr.io

env:
  IMAGE: ghcr.io/ahmeeedo/medo-design-system-docs

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: docs
      url: https://design.med-o.de
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Version
        id: version
        run: |
          echo "version=$(node -p "require('./packages/ui/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Plain docker commands instead of third-party actions: the repository only allows actions from GitHub,
      # its owner and changesets. The runner has Docker with Buildx; the cache lives next to the image in the registry.
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build . --push \
            --tag "$IMAGE:${{ steps.version.outputs.version }}" \
            --tag "$IMAGE:sha-${{ steps.version.outputs.sha }}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=med.o Design System documentation (Storybook)" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max"

      - name: Deploy on Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::notice title=Docs not deployed::Image ${IMAGE}:${{ steps.version.outputs.version }} is pushed. Add the secrets COOLIFY_WEBHOOK and COOLIFY_TOKEN to deploy it."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          echo "Deployed ${IMAGE}:${{ steps.version.outputs.version }} – https://design.med-o.de" >> "$GITHUB_STEP_SUMMARY"
