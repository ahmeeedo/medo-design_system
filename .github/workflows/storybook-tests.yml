# Storybook tests: every story renders in headless Chromium, axe checks WCAG 2.2 AA (Light and Dark),
# play functions test keyboard, focus and pointer. Same command as locally: npm test.
# Then the npm packages are built once, so a release never fails on a type error.
# Two more jobs run every story in WebKit (Safari's engine) and Firefox at the same time: layout, focus and events
# that only these engines handle differently.
name: Storybook tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: storybook-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Fixed OS: Playwright only installs system libraries on Ubuntu versions it knows (1.56: up to 24.04).
    # Raise this together with a Playwright update.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium plus the system libraries it needs (download takes seconds, no cache needed).
      - run: npx playwright install --with-deps chromium

      # VISUAL=1 adds the screenshot comparison – once references exist (workflow “Update screenshots” creates them).
      - run: npm test
        env:
          VISUAL: ${{ hashFiles('apps/storybook/__screenshots__/**/*.png') != '' && '1' || '' }}

      # On a visual mismatch: actual and diff images to download (Summary → Artifacts).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: apps/storybook/.vitest/
          if-no-files-found: ignore
          retention-days: 14

      # The npm packages must build (types included) before they can be released.
      - run: npm run build:packages

      # Bundle size of @med-o/ui (minified + gzip, React excluded) against the limits in packages/ui/package.json.
      - run: npm run size

  engines:
    # Every story in the other two engines: WebKit (Safari) and Firefox. Same OS as the job above; the browsers'
    # system libraries are installed by Playwright. One job per engine, so a failure names the browser.
    name: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      # Light only, without screenshots (references come from Chromium).
      - run: npm run test:${{ matrix.browser }}
