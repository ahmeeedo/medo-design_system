# Storybook tests – one job per question, so a red check says what is wrong:
#   test     every story in Chromium, Light, Dark and German: renders, play functions (keyboard, focus, pointer), axe
#            (WCAG 2.2 AA). Red = a real bug.
#   visual   one screenshot per docs story and theme against the references. Red = the look changed: check the diff
#            images (Summary → Artifacts); if the change is intended, run “Update screenshots” on the branch.
#   webkit, firefox   every story in Safari's and Firefox's engine. One retry; a story that passes only then is listed
#            as flaky in the summary.
#   build    the npm packages build (types and the component manifest included), stay within their size limits and
#            work in a fresh Vite and Next.js app.
#   docs     the documentation builds as for the deploy, and every prop on the component pages has a description.
# “Release” starts only when all of them passed for a push to main.
name: Storybook tests

on:
  pull_request:
  push:
    branches: [main]
  # Weekly: the build job installs the newest allowed versions of React, React Aria and Next.js, so a change there
  # (e.g. React Aria's still unstable toast API) shows up without waiting for our next commit.
  schedule:
    - cron: '17 4 * * 1'

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: storybook-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Fixed OS: Playwright only installs system libraries on Ubuntu versions it knows (1.56: up to 24.04).
    # Raise this together with a Playwright update.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Token rules first: fails in seconds, before the browser download.
      - run: npm run lint
      # Chromium plus the system libraries it needs (download takes seconds, no cache needed).
      - run: npx playwright install --with-deps chromium
      - run: npm test

  visual:
    # Same OS and browser as “Update screenshots”, or the references would not match.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      # Actual and diff images to download (Summary → Artifacts), plus what to do next.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: apps/storybook/.vitest/
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        run: |
          {
            echo '### The look changed'
            echo 'Open the artifact **screenshot-diffs** above: `*-actual.png` is new, `*-diff.png` marks the changed pixels.'
            echo 'Intended? Actions → **Update screenshots** → Run workflow on this branch. The new references are committed and the checks run again.'
          } >> "$GITHUB_STEP_SUMMARY"

  engines:
    # One job per engine, so a failure names the browser. Light only, no screenshots (references come from Chromium).
    name: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:${{ matrix.browser }}

  build:
    # What people install from npm: the packages build (types and manifest.json included; the manifest build fails on a
    # prop without a description), stay within their size limits and work in a fresh Vite and a fresh Next.js app with
    # the code of “Your first page”.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      # Bundle size of @med-o/ui (minified + gzip, React excluded) against the limits in packages/ui/package.json.
      - run: npm run size
      - run: npm run test:consumers

  docs:
    # The docs site as people get it: builds like the deploy (a broken page shows here, not after the release) and every
    # prop in a Playground table has a description – checked on the built pages, where Storybook's docgen ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:docs
