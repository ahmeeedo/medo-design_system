# Storybook tests: every story renders in headless Chromium, axe checks WCAG 2.2 AA (Light and Dark),
# play functions test keyboard, focus and pointer. Same command as locally: npm test.
name: Storybook tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: storybook-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Browser download is cached per Playwright version; system libraries are installed every run.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium

      - run: npm test
